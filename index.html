<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Websiteا من</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #ffffff;
            color: #000000;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 350px;
            width: 100%;
        }

        /* چارچووڤە و وێنە یان پیت */
        .profile-container {
            width: 120px;
            height: 120px;
            background-color: #f0f0f0;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 4px solid #ddd;
        }

        /* هەکە تو پیتەکێ بکاربینی */
        .profile-letter {
            font-size: 50px;
            font-weight: bold;
            color: #333;
        }

        /* هەکە تو وێنەیێ خۆ بکاربینی (ل جهێ پیتێ دابخە) */
        .profile-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            margin: 10px 0;
            font-size: 24px;
        }

        /* بۆ ئیمۆجیان (هەتا 15 ئیمۆجی) */
        .emojis {
            font-size: 24px;
            margin-top: 15px;
            line-height: 1.6;
            letter-spacing: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- بژاردەا 1: پیتەکا Custom -->
        <div class="profile-container">
            <span class="profile-letter">Y</span>
        </div>

        <!-- بژاردەا 2: وێنەیێ خۆ (هەکە تو بڤێی، ئەڤی ل خوارێ کارپێبکە و یا سەرێ لێ بکە دەر)
        <div class="profile-container">
            <img src="photo.jpg" alt="وێنەیێ من">
        </div>
        -->

        <h1>سلاڤ! خوشحال بم ب هاتنا تە</h1>
        
        <!-- ئیمۆجی (توشی دشێی هندەکێن دی زێدە بکەی، تا 15 ئیمۆجی یان پتر) -->
        <div class="emojis">
            😎🔥💻⚡🚀⚽ە🔥🎮✨👑
        </div>
    </div>

</body>
</html>
